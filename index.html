<html lang="pt-BR">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Estruturas condicionais e repetições</title>
    </head>
    <body>
        <h1>Classificação de lutadores</h1>
        <script>
            let peso = parseInt(prompt('Informe o seu peso:'));

            // Verifica se a entrada é um número válido
            if (isNaN(peso)) {
                alert('Por favor, informe um valor numérico válido.');
            } else if (peso <= 40) {
                alert('Você é peso pena');
            } else if (peso >= 41 && peso <= 60) {
                alert('Você é um peso mosca');
            } else {
               alert('Peso não classificado como pena ou mosca.');

            }
        </script>
    </body>
